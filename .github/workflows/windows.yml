name: Windows SentinelAV CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: apps/sentinel-desktop
        run: npm install --no-audit --no-fund
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Frontend typecheck and build
        working-directory: apps/sentinel-desktop
        run: npm run build
      - name: Build CLI
        run: cargo build --release -p sentinel-cli --target x86_64-pc-windows-msvc
      - name: Build Tauri Windows EXE and installer
        working-directory: apps/sentinel-desktop
        run: npm run tauri -- build --target x86_64-pc-windows-msvc
      - name: Package portable executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/sentinel-cli.exe dist/
          Copy-Item target/x86_64-pc-windows-msvc/release/sentinel-desktop.exe dist/SentinelAV.exe
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath SentinelAV-Windows-x64-portable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SentinelAV-Windows-x64-portable
          path: SentinelAV-Windows-x64-portable.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SentinelAV-Windows-x64-installer
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SentinelAV-Windows-x64-portable
      - uses: actions/download-artifact@v4
        with:
          name: SentinelAV-Windows-x64-installer
          path: installer
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            SentinelAV-Windows-x64-portable.zip
            installer/*.exe
          generate_release_notes: true
