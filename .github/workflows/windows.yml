name: Windows Rust CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Resolve dependencies
        run: cargo generate-lockfile
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked -p sentinel-cli --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/sentinel-cli.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath sentinel-av-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-av-windows-x64
          path: sentinel-av-windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sentinel-av-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: sentinel-av-windows-x64.zip
          generate_release_notes: true
